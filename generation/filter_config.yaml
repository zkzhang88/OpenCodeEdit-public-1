# Path to the input JSONL file containing data samples
jsonl_path: "data/ocedata_mix.jsonl"  

# List of field names to extract instruction content (do not change this if unsure)
field_name: ["code_before_purify", "instruct_purify"]  

# The construction format of the input dataset ("sharegpt" or "general") (do not change this if unsure)
data_format: "general"

# Run the complete pipeline ("filter") or only analyze the original input ("analyze_only")
run_mode: "filter"

# Seed for random operations to ensure reproducibility
random_seed: 42  

# Dictionary of filtering parameters
filter_settings:  
  # Maximum number of modified lines allowed per sample
  max_modify_lines: 70
  # Maximum number of hunks allowed per sample
  max_hunk_num: 99  # No hunk filtering any more
  # Maximum total number of samples after filtering
  max_samples_total: 20000
  # Whether to refit the HDP topic model
  refit: false

# Optional distribution plots (disabled by default)
statistics:
  # Plot modified-line and hunk distributions before and after diff filtering
  output_diff_distribution: true
  # Plot dominant-topic distributions before and after topic sampling
  output_topic_distribution: true
  # Directory for generated PDF files
  output_dir: "data/filtered/statistics"
